services:
  bug-tracker-postgres:
    image: postgres:18.7-bookworm
    container_name: bug-tracker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bug-tracker-db-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  
  bug-tracker-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      bug-tracker-postgres:
        condition: service_healthy



volumes:
  bug-tracker-db-data: